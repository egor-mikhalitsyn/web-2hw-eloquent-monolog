# Минимальный рабочий конфиг для учебного окружения.
# Файл подключается целиком через `command: postgres -c config_file=...`,
# поэтому всё, что не указано здесь, берётся из встроенных умолчаний PostgreSQL.

# Слушаем все интерфейсы контейнера — по умолчанию только localhost,
# и тогда ни nginx/php, ни клиент с хоста не смогут подключиться
listen_addresses = '*'
port = 5432

# Логируем запросы длительностью от 500 мс — простой способ ловить медленные места
log_min_duration_statement = 500
log_destination = 'stderr'

# Разумные значения по умолчанию для маленького дев-окружения
max_connections = 100
shared_buffers = 128MB
